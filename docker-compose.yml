services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data/db:/app/data
      - ./data/tmp:/app/tmp
      - ./data/cookies.txt:/app/cookies.txt:ro
    environment:
      - TZ=America/Sao_Paulo
      - YTDLP_COOKIES_FILE=/app/cookies.txt

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
